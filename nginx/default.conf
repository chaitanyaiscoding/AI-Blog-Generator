# Single entry point on port 80. "frontend" and "backend" are compose service
# names, resolved on the compose network.
upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Pass the original host and client address through, so Django's
    # ALLOWED_HOSTS and CSRF origin checks see what the browser sent.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API: /api/me/ -> backend /me/ (the trailing slash on proxy_pass strips /api).
    location /api/ {
        proxy_pass http://backend/;
        # Generating a blog (download + transcribe + LLM) can take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Django admin keeps its own paths.
    location /admin/ {
        proxy_pass http://backend;
    }

    # Everything else is the React app.
    location / {
        proxy_pass http://frontend;
    }
}
